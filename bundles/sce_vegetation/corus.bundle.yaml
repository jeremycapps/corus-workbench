ui_copy:
  hero:
    headline: When intelligence exists, customers still need significance.
    subhead: >
      This proof-of-work shows how public Neara RVO framing and SCE
      wildfire-planning context can be translated into customer-specific
      implementation meaning: who cares, what changes, what evidence is trusted,
      what assumptions are rejected, and what action is defensible.
  source_boundary:
    public_context: Neara RVO framing, Neara public case studies, and SCE wildfire-planning materials ground the implementation context.
    synthetic_fixture: Synthetic fixture data is retained only to exercise Corus admission, validation, permissioning, and audit behavior.
    rejected_assumption: Specific cost or operational claims are rejected unless customer-approved evidence exists.
  what_this_demo_proves:
  - Broad intelligence can be translated into customer-specific significance.
  - Different stakeholders need different answers to the same intelligence.
  - Public sources can ground context without overclaiming synthetic details.
  - Unsupported assumptions can be rejected rather than silently rendered as facts.
  - Recommended actions can be checked against permissions and evidence.
  - The reasoning path can be preserved for handoff, value review, and audit.
  out_of_scope:
  - Official Neara export verification
  - Official SCE operating model
  - Actual SCE cost exposure
  - Replacement of Neara RVO
  - Replacement of grid modeling, LiDAR, GIS, or simulation
  - Claiming that Neara produced the SCE public risk-model outputs

