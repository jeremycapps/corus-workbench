id: bundle.sce_significance_translation
name: SCE / Neara Significance Translation Demo
version: 2.0.0
timpo_sequence:
- 11612132757493222933514833726911676416
- 11612132757493222933514833726911676417

demo_goal:
  title: When intelligence exists, customers still need significance.
  central_question: Why does this matter to me?
  purpose: >
    Show how broad risk intelligence becomes customer-specific implementation
    significance: who cares, what changes, which workstreams are affected,
    what evidence is trusted, which assumptions are rejected, and what next
    action is defensible.
  not_the_goal:
  - Replace Neara RVO
  - Replace Neara grid modeling, LiDAR, GIS, or simulation
  - Claim an official Neara export
  - Claim an official SCE operating model
  - Validate a specific SCE dollar exposure
  - Treat the synthetic 72-watch-point fixture as the central demo event

central_demo_event:
  id: event.customer_needs_significance
  title: Customer needs significance from broad risk intelligence
  event_type: significance_translation_request
  story_grammar:
    once_upon_a_time:
      when_where: Public SCE wildfire mitigation context plus Neara public RVO framing
      corus_layer: timpo_context
      meaning: >
        The event is situated in a public utility wildfire-planning context and
        Neara's public RVO/risk-impact framing.
    who:
      initiator: Neara Customer Success / CVA / FDE / Strategic Implementation
      customer: SCE
      corus_layer: profile
      audience:
      - grid_ops
      - finance
      - regulatory
      - executive_sponsor
      - neara_implementation_team
    this:
      input: Broad risk intelligence exists
      corus_layer: source_claim
      examples:
      - refreshed wildfire risk-model outputs
      - RVO-style risk/consequence/cost framing
      - public case-study proof patterns
      - customer workstreams affected by model changes
    matter:
      corus_layer: surface_value
      implementation_consequences:
      - affected workstreams
      - stakeholder-specific questions
      - evidence requirements
      - rejected assumptions
      - defensible next action
    why:
      corus_layer: audit_because_trace
      result: situated significance
      rendered_as:
      - customer-specific implementation trace
      - stakeholder views
      - source boundary
      - action recommendation
      - audit proof

source_context:
  demo_frame: Significance translation from broad risk intelligence to customer-specific implementation context
  status: Public-source grounded scenario; not an official Neara export or SCE operating model.
  customer_implementation_pain: >
    Broad risk and grid-model intelligence must be translated into customer-specific
    workstreams, stakeholder questions, evidence requirements, assumptions,
    permissions, and defensible next actions.
  central_question:
    text: Why does this matter to me?
    resolved_by:
    - stakeholder
    - affected_workstream
    - evidence_boundary
    - rejected_assumption
    - defensible_action
  primary_source_ids:
  - source.neara_risk_impact_scoring
  - source.neara_risk_prioritization_case_study
  - source.neara_pole_replacement_case_study
  - source.sce_2025_wmp_update
  bounded_claims:
  - Neara publicly frames RVO as risk likelihood, consequence, cost-benefit, intervention selection, and decision justification.
  - Neara public case studies show adjacent proof patterns around risk prioritization, capital planning, and regulator-facing justification.
  - SCE public wildfire mitigation materials show refreshed risk-model outputs affecting inspections, vegetation management scope, and system-hardening scoping/schedules.
  - The demo remains synthetic where it asserts a specific Neara-style model output count or specific cost amount.

sources:
- id: source.neara_risk_impact_scoring
  file: artifacts/neara_risk_impact_scoring.json
  kind: product_context
  authority: public_neara_marketing
  source_status: public_web_page
  url: https://neara.com/capabilities/risk-impact-scoring
  trust_status:
  - source_labeled
  - public_source
  supports:
  - Neara publicly frames RVO as risk likelihood, consequence, cost-benefit, intervention selection, and decision justification.
  - Neara positions RVO around helping utilities validate decisions and gather context for risk mitigation or asset upgrade decisions.
  - RVO supports the idea that technical intelligence must become defensible customer action.
  limits:
  - Does not prove an official Neara export exists for this demo.
  - Does not validate the synthetic 72-watch-point count.
  - Does not validate any SCE-specific cost exposure.
- id: source.neara_risk_prioritization_case_study
  file: artifacts/neara_risk_prioritization_case_study.json
  kind: proof_pattern
  authority: public_neara_case_study
  source_status: public_web_page
  url: https://neara.com/resources/case-studies/risk-prioritization-reducing-saidi/
  trust_status:
  - source_labeled
  - public_source
  supports:
  - Neara publicly describes risk-prioritization workflows.
  - The case study connects risk scoring to planning, prioritization, capital confidence, and utility decision-making.
  - The case study supports the pattern that technical outputs need customer-facing explanation and prioritization.
  limits:
  - Not identified as SCE.
  - Does not validate the demo synthetic count.
- id: source.neara_pole_replacement_case_study
  file: artifacts/neara_pole_replacement_case_study.json
  kind: proof_pattern
  authority: public_neara_case_study
  source_status: public_web_page
  url: https://neara.com/resources/case-studies/case-study-utility-defers-25k-pole-replacements/
  trust_status:
  - source_labeled
  - public_source
  supports:
  - Neara publicly describes using physics-based analysis to support pole replacement decisions.
  - The case study supports the pattern of technical analysis becoming defensible investment justification.
  - The case study supports the need for regulator-facing evidence.
  limits:
  - Not identified as SCE.
  - Does not validate a demo-specific cost amount.
- id: source.sce_2025_wmp_update
  file: artifacts/sce_2025_wmp_update_public_filing.json
  kind: customer_operating_context
  authority: public_sce_regulatory_filing
  source_status: public_pdf
  url: https://www.sce.com/sites/default/files/AEM/Wildfire%20Mitigation%20Plan/2023-2025/SCE%202025%20WMP%20Update%20R1.pdf
  trust_status:
  - source_labeled
  - public_source
  supports:
  - SCE describes wildfire-risk-model updates and top-risk circuit/segment reporting.
  - SCE describes how new risk-model information affects different mitigation workstreams differently.
  - SCE describes refreshed risk outputs affecting inspection strategy, vegetation management scope, and system-hardening scoping/schedules.
  - SCE provides public customer-side operating context for implementation translation.
  limits:
  - Does not claim Neara generated SCE's risk-model outputs.
  - Does not validate the synthetic 72-watch-point count.
  - Does not validate a specific SCE dollar exposure for the demo.
- id: source.demo_model_output
  file: artifacts/demo_model_output.json
  kind: synthetic_fixture
  authority: demo_synthetic
  source_status: synthetic_internal_fixture
  trust_status:
  - demo_synthetic
  - source_authority_missing
  supports:
  - Exercises Corus admission, validation, permissioning, and audit mechanics.
  limits:
  - Must not be treated as the central demo event.
  - Must not be presented as an official Neara export.
  - Must not be presented as an official SCE source.

