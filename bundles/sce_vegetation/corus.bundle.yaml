  - claim.sce.watch_points_added
  - claim.sce.unsupported_cost_assumption
  - output.sce_grid_ops.work_packet
  - artifacts/demo_model_output.json
  do_not_use_as_central_event:
  - 72 synthetic watch points translated
  replacement_central_event:
  - fact.customer.needs_significance
  - claim.customer.needs_significance
  - output.implementation_context_trace
